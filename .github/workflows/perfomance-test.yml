name: BlazeMeter Test Upload

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: BlazeMeter test name
        required: true
        default: K6 upload from GitHub Actions
      project_id:
        description: BlazeMeter project ID
        required: true

jobs:
  create-and-upload-test:
    runs-on: ubuntu-latest
    env:
      BLAZEMETER_BASE_URL: https://a.blazemeter.com/api/v4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get BlazeMeter access token
        id: token
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body -sS -X POST "$BLAZEMETER_BASE_URL/user/token" \
            -H "Content-Type: application/json" \
            -d @- <<EOF > token-response.json
          {
            "apiKey": "${{ secrets.BLAZEMETER_API_KEY }}",
            "apiSecret": "${{ secrets.BLAZEMETER_API_SECRET }}"
          }
          EOF

          TOKEN=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('token-response.json').read_text())
          token = data.get('token') or data.get('accessToken') or data.get('data', {}).get('token')
          if not token:
              raise SystemExit('BlazeMeter token not found in token response')
          print(token)
          PY
          )

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create BlazeMeter test
        id: create_test
        shell: bash
        env:
          BLAZEMETER_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS -X POST "$BLAZEMETER_BASE_URL/tests" \
            -H "Authorization: Bearer $BLAZEMETER_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- <<EOF > create-test-response.json
          {
            "name": "${{ inputs.test_name }}",
            "projectId": "${{ inputs.project_id }}"
          }
          EOF

          TEST_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('create-test-response.json').read_text())
          test_id = data.get('id') or data.get('data', {}).get('id')
          if not test_id:
              raise SystemExit('BlazeMeter test id not found in create response')
          print(test_id)
          PY
          )

          echo "test_id=$TEST_ID" >> "$GITHUB_OUTPUT"

      - name: Upload test2.js to BlazeMeter
        shell: bash
        env:
          BLAZEMETER_TOKEN: ${{ steps.token.outputs.token }}
          TEST_ID: ${{ steps.create_test.outputs.test_id }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS -X POST "$BLAZEMETER_BASE_URL/tests/$TEST_ID/files" \
            -H "Authorization: Bearer $BLAZEMETER_TOKEN" \
            -F "file=@test2.js;type=text/javascript" \
            -F "name=test2.js"
